# The deploy bot's own ArgoCD app: plain Kubernetes manifests from apps/slack-deploy-bot/ in Git
# (no Helm), manual sync like a Peddle prod app.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: slack-deploy-bot
  namespace: argocd
spec:
  project: devops
  destination:
    server: https://kubernetes.default.svc
    namespace: slack-deploy-bot
  syncPolicy: {}
  source:
    repoURL: https://github.com/Piyush9565/deploy-bot-sandbox.git
    targetRevision: main
    path: apps/slack-deploy-bot
