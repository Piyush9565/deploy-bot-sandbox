# External Secrets Operator: same chart and version as Peddle prod
# (ped-terraform/production/eks/external-secret-helm.tf). It copies SSM parameters into Kubernetes Secrets.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.3.0
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true  # the CRDs are too large for client-side apply
