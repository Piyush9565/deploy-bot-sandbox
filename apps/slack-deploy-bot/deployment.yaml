# The bot itself: one pod running the image from ECR. At startup the bot reads its tokens and
# allowlists straight from SSM Parameter Store (every parameter under SSM_PARAMETER_PATH, SecureStrings
# decrypted) and keeps them in memory only. There's no Kubernetes Secret and no periodic refresh:
# restart the pod to pick up changed values.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slack-deploy-bot
  namespace: slack-deploy-bot
  labels:
    app.kubernetes.io/name: slack-deploy-bot
spec:
  replicas: 1
  strategy:
    type: Recreate  # one Slack Socket Mode connection at a time
  selector:
    matchLabels:
      app.kubernetes.io/name: slack-deploy-bot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: slack-deploy-bot
    spec:
      serviceAccountName: slack-deploy-bot
      automountServiceAccountToken: false  # the bot talks to ArgoCD's API, never to Kubernetes directly
      enableServiceLinks: false
      imagePullSecrets:
        - name: ecr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      # Prod EKS: keep the pod on the Karpenter pool that only consolidates empty nodes.
      # tolerations:
      #   - key: peddle/graviton-taint-no-rebalance
      #     operator: Exists
      #     effect: NoSchedule
      containers:
        - name: bot
          image: 885287756345.dkr.ecr.ap-southeast-2.amazonaws.com/slack-deploy-bot:9a297d2
          env:
            - name: SSM_PARAMETER_PATH
              value: /slack-deploy-bot
            - name: AWS_DEFAULT_REGION  # boto3 doesn't read AWS_REGION
              value: ap-southeast-2
            - name: ARGOCD_URL
              value: https://argocd-server.argocd.svc
            - name: ARGOCD_VERIFY_TLS
              value: "false"  # test cluster uses ArgoCD's self-signed certificate
            - name: SYNC_TIMEOUT_SECONDS
              value: "600"
            - name: CONFIRM_TTL_SECONDS
              value: "300"
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
