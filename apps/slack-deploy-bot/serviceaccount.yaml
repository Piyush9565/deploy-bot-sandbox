# The bot's identity in Kubernetes. With IRSA (EKS), the annotation below maps this ServiceAccount to
# an IAM role, and the bot pod reads SSM as that role. IRSA is blocked in the test account (the
# organization denies iam:CreateOpenIDConnectProvider), so the bot uses the node's IAM role instead.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: slack-deploy-bot
  namespace: slack-deploy-bot
  labels:
    app.kubernetes.io/name: slack-deploy-bot
  # annotations:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::885287756345:role/slack-deploy-bot-irsa
automountServiceAccountToken: false
