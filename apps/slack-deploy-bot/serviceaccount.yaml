# The bot's identity in Kubernetes. With IRSA, this ServiceAccount maps to an IAM role through the
# annotation below, and External Secrets reads SSM as this role. IRSA is blocked in the test account
# (the organization denies iam:CreateOpenIDConnectProvider), so the annotation stays commented out.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: slack-deploy-bot
  namespace: slack-deploy-bot
  labels:
    app.kubernetes.io/name: slack-deploy-bot
  # annotations:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::885287756345:role/slack-deploy-bot-irsa
automountServiceAccountToken: false
