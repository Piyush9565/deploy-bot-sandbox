# SecureString parameters under /slack-deploy-bot/ -> Kubernetes Secret "slack-deploy-bot-secrets",
# which the Deployment loads as environment variables. Re-read every 5 minutes.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: slack-deploy-bot-secrets
  namespace: slack-deploy-bot
  labels:
    app.kubernetes.io/name: slack-deploy-bot
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: parameter-store
  target:
    name: slack-deploy-bot-secrets
  data:
    - secretKey: SLACK_BOT_TOKEN
      remoteRef:
        key: /slack-deploy-bot/SLACK_BOT_TOKEN
    - secretKey: SLACK_APP_TOKEN
      remoteRef:
        key: /slack-deploy-bot/SLACK_APP_TOKEN
    - secretKey: ARGOCD_TOKEN
      remoteRef:
        key: /slack-deploy-bot/ARGOCD_TOKEN
    - secretKey: ALLOWED_USER_IDS
      remoteRef:
        key: /slack-deploy-bot/ALLOWED_USER_IDS
    - secretKey: ALLOWED_CHANNEL_IDS
      remoteRef:
        key: /slack-deploy-bot/ALLOWED_CHANNEL_IDS
