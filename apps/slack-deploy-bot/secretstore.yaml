# Where External Secrets reads from: SSM Parameter Store in this account and region.
# Without an auth block it uses the node's IAM role. With IRSA, uncomment auth so it reads SSM as the
# role annotated on the slack-deploy-bot ServiceAccount instead.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: parameter-store
  namespace: slack-deploy-bot
  labels:
    app.kubernetes.io/name: slack-deploy-bot
spec:
  provider:
    aws:
      service: ParameterStore
      region: ap-southeast-2
      # auth:
      #   jwt:
      #     serviceAccountRef:
      #       name: slack-deploy-bot
