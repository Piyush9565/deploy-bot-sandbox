# Slack deploy bot. Code comes from the slack-deploy-bot-code ConfigMap (bot.py + requirements.txt);
# tokens come from the slack-deploy-bot Secret, created by scripts/deploy-bot-secrets.sh.
apiVersion: v1
kind: ConfigMap
metadata:
  name: slack-deploy-bot-config
  namespace: slack-deploy-bot
data:
  ALLOWED_USER_IDS: "REPLACE_WITH_SLACK_USER_ID"
  ALLOWED_CHANNEL_IDS: "REPLACE_WITH_SLACK_CHANNEL_ID"
  ARGOCD_URL: https://argocd-server.argocd.svc
  SYNC_TIMEOUT_SECONDS: "600"
  CONFIRM_TTL_SECONDS: "300"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slack-deploy-bot
  namespace: slack-deploy-bot
spec:
  replicas: 0  # scaled to 1 once the Secret and allowlist are in place
  strategy:
    type: Recreate  # one Socket Mode connection at a time
  selector:
    matchLabels:
      app: slack-deploy-bot
  template:
    metadata:
      labels:
        app: slack-deploy-bot
    spec:
      automountServiceAccountToken: false  # the bot talks to ArgoCD, not the Kubernetes API
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: bot
          image: python:3.12-slim
          command:
            - sh
            - -c
            - pip install --no-cache-dir --quiet --target /tmp/deps -r /app/requirements.txt && exec python /app/bot.py
          env:
            - name: PYTHONPATH
              value: /tmp/deps
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: HOME
              value: /tmp
          envFrom:
            - configMapRef:
                name: slack-deploy-bot-config
            - secretRef:
                name: slack-deploy-bot
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: code
          configMap:
            name: slack-deploy-bot-code
